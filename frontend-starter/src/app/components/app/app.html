<header class="site-header">
  <a class="brand" routerLink="/tracks" aria-label="Guitar Practice Cloud, bibliothèque">
    <svg viewBox="0 0 24 32" aria-hidden="true"><path d="M15 0 1 18h9L6 32l17-21h-10z" fill="currentColor" /></svg>
    <span>Guitar Practice Cloud</span>
  </a>
  <nav aria-label="Navigation principale">
    <a routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">Bibliothèque</a>
    <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profil</a>
    @if (auth.token()) {
      <button type="button" (click)="logout()">Se déconnecter</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
    }
    <svg class="profile-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><circle cx="12" cy="8" r="3.3" fill="#121014"/><path d="M6 19v-2a6 6 0 0 1 12 0v2z" fill="#121014"/></svg>
  </nav>
</header>
<main><router-outlet /></main>
